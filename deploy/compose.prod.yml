# Production overlay.
#
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d
#
# Adds restart policies and memory limits, and stops publishing host ports for
# everything except the gateway. TLS, routing and certificate renewal are the
# container platform's job (Traefik, managed by Coolify), so there is no
# reverse proxy defined here: one less moving part than hand-rolling one.
services:
  postgres:
    ports: !override []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512M } } }

  redis:
    ports: !override []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  jaeger:
    ports: !override []
    command: ["--memory.max-traces=5000"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 400M } } }

  search:
    ports: !override []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  ranking:
    ports: !override []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 192M } } }

  enrich:
    ports: !override []
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256M } } }

  # The only service the platform routes traffic to.
  gateway:
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 192M } } }
